version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - API_V1_STR=/api/v1
      - APP_NAME="PayGuard API"
      - SECRET_KEY=supersecretkey_please_change_in_production_12345
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - SQLALCHEMY_DATABASE_URI=sqlite+aiosqlite:///./payguard.db
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:80","http://localhost"]
      - FRAUD_BLOCK_THRESHOLD=60
    volumes:
      - ./backend/payguard.db:/app/payguard.db
      - ./ml/models:/app/ml/models
      - ./ml/datasets:/app/ml/datasets
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
